# Маркеры деталей. Сравнение после fold() (см. reference/normalize.py), поэтому
# «подъезд»/«подьезд», «пәтер»/«патер» можно не дублировать, но дубли не мешают.
# Маркер может стоять до числа («кв 70», «кв.70», «kv12») или после («239 кв», «4подьезд», «11дом»).

apartment: [кв, квартира, квартиры, квар, кварт, квр, кв-ра, кв-а, квартра, квартиа, кваритра, квратира,
            kv, kvartira, kv-ra, flat, fl, apt, apart, apartment, app, пәтер, пәт, патер, пат,
            оф, офис, office, комн, комната, room,
            # нежилые помещения: тот же номер внутри здания, что и квартира (docs/QUESTIONS.md, Q10)
            бутик, бут, павильон, пав, кабинет, каб, помещение, пом, нп, н/п, склад, бокс, ячейка]
entrance: [подъезд, подьезд, подъез, подьез, подезд, подъ, под, подьед, подъзд, подьзд, падъезд, подъеза, п,
           п-д, пд, пдз, pod, podezd, podyezd, entrance, кіреберіс, киреберис, кіребер]
floor: [этаж, эт, этажа, этж, етаж, etazh, etaj, et, floor, flr, қабат, кабат, кабаты, қабаты]
house: [дом, д, дм, dom, house, үй, уй, үйі, здание, зд, участок, уч, уч-к, участ, ст-е, ғимарат, гимарат]

# «дом-квартира» через дефис: «Абая 150-23» -> house 150, apartment 23 (docs/QUESTIONS.md, Q8)
house_dash_apartment: true

# слова, которые потребляются без поля (не должны попадать в street_name / landmark)
noise: [адрес, адресу, address, по, д/о, индекс, index, тел, телефон, номер, №, n, "no", rk, рк, республика,
        казахстан, kazakhstan, қазақстан, қр, кз, kz, respublika,
        # просьбы курьеру в поле адреса («домофон 14В звонить заранее»): не улица и не ориентир
        домофон, домофона, код, звонить, позвонить, позвоните, заранее, предварительно]

# корпус / блок / строение: в house не входят (Q10), но забираются вместе с номером (шаг parts),
# чтобы номер корпуса не стал квартирой, а слово «корп» не попало в название улицы
building_part: [корпус, корп, к, с, блок, бл, block, литер, лит, строение, стр, корпусы, korpus]

# организационно-правовые формы: название организации после них не адрес («ТОО «Альфа»», «ИП Касымов»)
org_forms: [тоо, ооо, жшс, ип, llp, llc, jsc, ltd, кгу, гккп, ргп, ргку, мкк, тдо]
# то же, но только заглавными: «АО Казахтелеком», а «ао» или «Ак» в названии улицы не трогаем
org_forms_upper: [ао, ак, оо, пк, чп]

# слова, перед которыми число это часть названия улицы, а не дом: «40 лет Победы», «9 Мая», «8 Марта»
number_name_words: [лет, летия, года, января, февраля, марта, апреля, мая, июня, июля, августа, сентября,
                    октября, ноября, декабря, съезда, партсъезда, дивизии, гвардейской, панфиловцев, армии,
                    жылдығы, жылдыгы, жыл, мамыр, наурыз, желтоқсан, желтоксан]

# однобуквенные сокращения засчитываются как маркер, только если за ними точка в строке
# («у. Абая», «ш. Алматинское»), иначе это может быть предлог или опечатка. Исключения в коде:
# «д 5»/«д5» (дом перед числом) и «г Алматы» (известный город).
needs_dot: [у, ш, а, с, п, г, к, б, т]

# однобуквенные маркеры деталей, которые срабатывают только прямо перед числом (через точку):
# «д. 15, п. 9» -> подъезд 9, но «п. Береке» это посёлок
needs_number: [п]
