# Типы улиц. Ключ это каноническое значение street_type (нижний регистр).
# kind: street   - линейный объект (номер после названия = дом)
#       numbered - улица, у которой номер может быть названием («5 линия», «2-я линия»)
#       area   - площадной (микрорайон, квартал, ЖК...): номер рядом с маркером входит в название
#                («мкр Аксай 3а», «66квартал», «Нурсити 2 микрорайон»); с отдельной улицей уходит в living_area
# aliases сравниваются после fold(): регистр, ё/е, казахские буквы, ъ/ь, дефис = пробел, точка по краям.
# Многословные алиасы ("шағын ауданы") допустимы. Добавлять можно без правки кода.

улица:
  kind: street
  aliases: [ул, улица, у, улиц, улица., улицы, ули, уо, улитса, улитца, улца, улиця, ulica, ulitsa, ulitca, ul,
            str, street, st,
