# Маркеры административных единиц. Сами названия (и их алиасы) берутся из справочника.

province_markers: [область, обл, облысы, облыс, обл-ть, region, oblast, obl, oblysy]
district_markers: [район, р-н, р-он, рн, раион, районе, ауданы, аудан, рай, raion, rayon, district, audany]
# «шағын ауданы»/«ықшам ауданы» это микрорайон, а не район: слово перед маркером
district_blockers: [шағын, ықшам, шагын, ыкшам]

city_prefix: [город, г, гор, г-д, гор-д, city, gorod, g, қ]
city_suffix: [қаласы, каласы, қала, kalasy, qalasy, қ, г, city]
settlement_prefix: [поселок, пос, п, пгт, рп, село, с, аул, а, ауыл, станция, ст, станц, деревня, дер, хутор,
                    posyolok, poselok, pos, selo, aul, s]
settlement_suffix: [ауылы, ауыл, кенті, кент, aýyly, auyly, kenti]
# однобуквенные префиксы (г, п, с, а, ст) срабатывают только если дальше известный населённый пункт
weak_prefixes: [п, с, а, ст, g, s, қ]
# сельский/аульный округ: потребляется без поля
rural_okrug: [сельский округ, с/о, со, сельский окр, аульный округ, а/о, ауылдық округі, ауылдық округ, с.о]

# переделы областей: город/район теперь в новой области, а люди пишут старую («ВКО, г. Семей»).
# Такая пара не конфликт (confidence не штрафуется); province остаётся как написано (docs/QUESTIONS.md, Q18).
# Ключ: нынешняя область (как в справочнике), значение: прежние.
historical_provinces:
  Абайская область: [Восточно-Казахстанская область]          # 2022
  Жетысуская область: [Алматинская область]                   # 2022
  Улытауская область: [Карагандинская область]                # 2022
  Шымкент: [Туркестанская область]                            # 2018, город республиканского значения
  Алматы: [Алматинская область]
  Астана: [Акмолинская область]
