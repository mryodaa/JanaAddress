# Веса функции confidence (pipeline/confidence.py). Итог = clip(base + сумма, 0.02, 0.99).
# Калибровку проверять scripts/eval.py (раздел «Калибровка», ECE) на dev_gold и подстраивать здесь.

base: 0.35
# доля потреблённых токенов-слов/чисел (0..1) * вес
consumed_ratio: 0.30
# наличие полей из строки
has_street_name: 0.12
has_house: 0.12
has_city_or_province: 0.06
# штрафы
per_unparsed_token: -0.05
max_unparsed_penalty: -0.25
no_street_and_house: -0.30
flags:
  model_override: -0.02
  model_disagree: -0.01
  model_agree_all: 0.11
  city_province_conflict: -0.20
  layout_fixed: -0.10          # строка перекодирована из английской раскладки (Q19)
  house_like_area_number: -0.10
  ambiguous_orientation: -0.06
  bilingual_unresolved: -0.05
  fuzzy_admin: -0.05
  guessed_street: -0.08
  guessed_city: -0.05
  city_district_conflict: -0.05  # пункт не из района, написанного в строке: город как в строке
  extra_numbers: -0.08
  district_ambiguous: -0.04    # улица в нескольких районах: взят лучший по доле (Q20)
  # восстановление по справочнику с пониженной уверенностью (pipeline/reference_step.py); поля вне строки
  # в метрику почти не входят, поэтому поправки маленькие: только чтобы UI показал сомнение
  living_area_ambiguous: -0.02  # улица в нескольких мкр: взят лучший по доле
  living_area_by_point: -0.01   # мкр дома по ближайшей place-точке, полигона нет
  district_by_landmark: -0.02   # район по ориентиру, улицы в строке нет
  district_by_near_polygon: -0.01  # село чуть за границей полигона района
  street_type_dominant: -0.01   # тип улицы без маркера: доминирующий среди одноимённых
  street_not_in_reference: -0.03
  building_part_ignored: -0.05
  marker_without_number: -0.05
bonus:
  street_in_reference: 0.06
  house_in_reference: 0.04
