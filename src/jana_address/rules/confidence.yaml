# Веса функции confidence (pipeline/confidence.py). Итог = clip(base + сумма, 0.02, 0.99).
# Калибровку проверять scripts/eval.py (раздел «Калибровка», ECE) на dev_gold и подстраивать здесь.

base: 0.35
# доля потреблённых токенов-слов/чисел (0..1) * вес
consumed_ratio: 0.30
# наличие полей из строки
has_street_name: 0.12
has_house: 0.12
has_city_or_province: 0.06
# штрафы
per_unparsed_token: -0.05
max_unparsed_penalty: -0.25
no_street_and_house: -0.30
flags:
  city_province_conflict: -0.20
  house_like_area_number: -0.10
  ambiguous_orientation: -0.06
  bilingual_unresolved: -0.05
  fuzzy_admin: -0.05
  guessed_street: -0.08
  guessed_city: -0.05
  extra_numbers: -0.08
  district_ambiguous: -0.04
  street_not_in_reference: -0.03
  building_part_ignored: -0.05
  marker_without_number: -0.05
bonus:
  street_in_reference: 0.06
  house_in_reference: 0.04
