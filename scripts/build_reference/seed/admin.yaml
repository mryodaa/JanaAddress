# Ручное ядро справочника (source=seed). Собрано по общедоступным сведениям об АТД РК (2022+):
# 17 областей, 3 города республиканского значения и их районы, областные центры и крупные города.
# OSM и КАТО (build_sqlite.py) дополняют это ядро. При конфликте названия ядра считаются каноническими
# для формата ответа: область «Актюбинская область», город «Актобе», район «Илийский».
#
# aliases: любые написания (рус/каз/лат/старые). fold() снимает регистр, ё/е, казахские буквы, дефисы.

