[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jana-address"
version = "0.1.0"
description = "Разбор однострочных адресов Казахстана на поля + восстановление по собственному справочнику"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    # теггер: без них tagger.load() вернёт None и сервис тихо уйдёт на одни правила (метрика ниже)
    "numpy>=2.0",
    "onnxruntime>=1.18",
]
# точные версии рантайма (как в образе): requirements.txt, ставится `pip install -r requirements.txt`

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]
# только для сборки справочника (scripts/build_reference), в рантайм-образ не ставятся
build = ["osmium>=3.7", "shapely>=2.0", "openpyxl>=3.1", "requests>=2.32"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jana_address = ["rules/*.yaml", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["perf: замеры производительности"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях это норма

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["jana_address"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rapidfuzz.*", "onnxruntime.*"]
ignore_missing_imports = true
